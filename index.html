<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ชิกชิกเก้นฉีก</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .product-card:active { transform: scale(0.92); }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
        
        /* สไตล์สำหรับ Scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="h-full bg-[#F8FAFC]">

    <div class="h-full flex flex-col">
        <header class="glass-header sticky top-0 z-40 px-6 py-5 border-b flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-orange-600 tracking-tighter italic">CHICK CHICK</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Self-Service Ordering</p>
            </div>
            <div class="bg-orange-50 text-orange-600 px-4 py-1 rounded-full text-xs font-black border border-orange-100">
                TABLE 05
            </div>
        </header>

        <main id="customer-menu" class="flex-1 overflow-y-auto p-5 pb-32 grid grid-cols-2 gap-4">
            <div class="col-span-2 py-20 text-center text-slate-400 font-medium">
                <div class="animate-bounce mb-2">🍗</div>
                กำลังโหลดเมนูความอร่อย...
            </div>
        </main>

        <div id="bottom-cart" class="fixed bottom-0 left-0 right-0 p-6 z-50 transform translate-y-full transition-transform duration-500 ease-out">
            <button onclick="openOrderSummary()" class="w-full bg-slate-900 text-white p-5 rounded-[2.5rem] flex justify-between items-center shadow-2xl active:scale-95 transition-all">
                <div class="flex items-center gap-4">
                    <div id="cart-count" class="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ring-4 ring-slate-800">0</div>
                    <span class="font-bold text-lg">รายการที่เลือก</span>
                </div>
                <span id="cart-total" class="font-black text-2xl tracking-tighter text-orange-400">฿0</span>
            </button>
        </div>

        <div id="order-overlay" class="fixed inset-0 bg-white z-[60] transform translate-y-full transition-transform duration-500 overflow-y-auto p-8">
            <div class="max-w-xl mx-auto">
                <div class="flex justify-between items-center mb-8">
                    <button onclick="closeOrderSummary()" class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">✕</button>
                    <h2 class="text-2xl font-black text-slate-800">สรุปออเดอร์</h2>
                    <div class="w-12"></div>
                </div>
                
                <div id="order-items" class="space-y-4 mb-10"></div>
                
                <div class="bg-slate-50 p-8 rounded-[2.5rem] mb-10">
                    <div class="flex justify-between font-black text-3xl text-slate-800">
                        <span>สุทธิ</span>
                        <span id="summary-total" class="text-orange-600">฿0</span>
                    </div>
                </div>
                
                <button onclick="openPaymentModal()" class="w-full bg-orange-600 text-white py-6 rounded-[2.5rem] font-black text-2xl shadow-xl shadow-orange-100 active:scale-95 transition-all">
                    ไปที่หน้าชำระเงิน
                </button>
            </div>
        </div>

        <div id="payment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-[3rem] p-8 w-full max-w-sm text-center pop-in">
                <h3 class="font-black text-xl text-slate-800 mb-1">ชำระเงิน</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6">PromptPay Dynamic QR</p>
                
                <div class="bg-white p-4 rounded-[2.5rem] border-2 border-slate-100 mb-6">
                    <img id="qr-display-image" src="" class="mx-auto w-full max-w-[220px] rounded-2xl">
                    <p id="payment-amount" class="text-4xl font-black text-slate-900 mt-4 tracking-tighter">฿0</p>
                </div>
                
                <div class="space-y-3">
                    <button onclick="processOrder()" id="confirm-payment-btn" class="w-full py-5 bg-orange-600 text-white rounded-[2rem] font-bold text-xl active:scale-95 transition-all">
                        โอนแล้ว ยืนยันสั่งซื้อ
                    </button>
                    <button onclick="closePaymentModal()" class="text-slate-400 font-bold text-sm">ย้อนกลับ</button>
                </div>
            </div>
        </div>

        <div id="success-popup" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[110] hidden flex items-center justify-center p-6 text-center">
            <div class="bg-white rounded-[3.5rem] p-12 w-full max-w-sm pop-in border-4 border-orange-500">
                <div class="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg">✓</div>
                <h3 class="text-3xl font-black mb-2 tracking-tighter text-slate-800">สั่งอาหารสำเร็จ!</h3>
                <p class="text-slate-500 mb-8 font-medium italic">ใบคิวพิมพ์ออกที่เครื่องแล้วค่ะ</p>
                <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl">
                    <p class="text-[10px] text-orange-400 font-black mb-2 tracking-[0.2em]">QUEUE NO.</p>
                    <h2 id="popup-queue-no" class="text-7xl font-black tracking-tighter">----</h2>
                </div>
            </div>
        </div>
    </div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbztypqVeKdZHc6MBDBjP-S8G3ZtObFgUcWkJxcgU-ElsQyupKSBu-yz9TZ3V93W5VFM/exec';
    const PROMPTPAY_ID = '0646793964';
    let products = [], cart = [];

    async function loadMenu() {
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getProducts' }) });
            const result = await res.json();
            if (result.success) {
                products = result.data.filter(p => p.status === 'active');
                renderMenu();
            }
        } catch(e) { console.error("Load error"); }
    }

    function renderMenu() {
        const grid = document.getElementById('customer-menu');
        grid.innerHTML = products.map(p => `
            <div class="product-card bg-white rounded-[2rem] p-2 shadow-sm border border-slate-50" onclick="addToCart('${p.id}')">
                <img src="${p.image || ''}" class="w-full aspect-square object-cover rounded-[1.5rem] mb-3 bg-slate-50">
                <div class="px-2 pb-2 text-center">
                    <h4 class="font-bold text-slate-800 text-xs truncate">${p.name}</h4>
                    <p class="text-orange-600 font-black text-lg italic mt-1">฿${parseFloat(p.price).toLocaleString()}</p>
                </div>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const p = products.find(i => i.id === id);
        const item = cart.find(i => i.productId === id);
        if (item) item.qty++; else cart.push({...p, productId: id, qty: 1});
        updateCartUI();
    }

    function updateCartUI() {
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('bottom-cart').classList.toggle('translate-y-full', count === 0);
        document.getElementById('cart-count').textContent = count;
        document.getElementById('cart-total').textContent = `฿${total.toLocaleString()}`;
    }

    function openOrderSummary() {
        document.getElementById('order-items').innerHTML = cart.map(i => `
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-[1.5rem]">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-slate-800 truncate">${i.name}</p>
                    <p class="text-orange-600 font-black text-sm">฿${i.price}</p>
                </div>
                <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl shadow-sm">
                    <button onclick="changeQty('${i.productId}', -1)" class="text-slate-300 font-bold">－</button>
                    <span class="font-black text-slate-800 w-4 text-center">${i.qty}</span>
                    <button onclick="changeQty('${i.productId}', 1)" class="text-orange-500 font-bold">＋</button>
                </div>
            </div>
        `).join('');
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        document.getElementById('summary-total').textContent = `฿${total.toLocaleString()}`;
        document.getElementById('order-overlay').classList.remove('translate-y-full');
    }

    function changeQty(id, d) {
        const item = cart.find(i => i.productId === id);
        if (item) { item.qty += d; if (item.qty <= 0) cart = cart.filter(i => i.productId !== id); }
        updateCartUI();
        if (cart.length === 0) closeOrderSummary(); else openOrderSummary();
    }

    function openPaymentModal() {
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        document.getElementById('payment-amount').textContent = `฿${total.toLocaleString()}`;
        document.getElementById('qr-display-image').src = `https://promptpay.io/${PROMPTPAY_ID}/${total}.png`;
        document.getElementById('payment-modal').classList.remove('hidden');
    }

    function closePaymentModal() { document.getElementById('payment-modal').classList.add('hidden'); }
    function closeOrderSummary() { document.getElementById('order-overlay').classList.add('translate-y-full'); }

    // ฟังก์ชันสำคัญ: ส่งข้อมูลให้ Kitchen Server พิมพ์ออโต้
    async function processOrder() {
        const btn = document.getElementById('confirm-payment-btn');
        btn.disabled = true;
        btn.innerText = "กำลังสั่งอาหาร...";

        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        const queueNo = Math.floor(Math.random() * 900 + 1).toString().padStart(3, '0');

        try {
            // ส่งข้อมูลไปที่ Google Sheets (หน้า Kitchen จะดึงไปพิมพ์)
            await fetch(API_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ 
                    action: 'addSale', 
                    items: cart, 
                    total: total, 
                    orderType: 'Self-Service',
                    queueNo: queueNo 
                }) 
            });

            // แสดงหน้าจอสำเร็จ
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('popup-queue-no').innerText = queueNo;
            document.getElementById('success-popup').classList.remove('hidden');

            // รีเซ็ตหน้าใน 4 วินาที
            setTimeout(() => { location.reload(); }, 4000);

        } catch (e) {
            alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
            btn.disabled = false;
        }
    }

    window.onload = loadMenu;
</script>
</body>
</html>
