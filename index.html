<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ชิกชิกเก้นฉีก</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .product-card:active { transform: scale(0.92); }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="h-full bg-[#F8FAFC]">

    <div class="h-full flex flex-col">
        <header class="glass-header sticky top-0 z-40 px-6 py-5 border-b flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-orange-600 tracking-tighter">CHICK CHICK</h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-[0.2em]">สั่งอาหารออโต้</p>
            </div>
            <button onclick="connectPrinter()" id="printer-status" class="bg-red-50 text-red-500 px-3 py-1 rounded-full text-[10px] font-bold">เชื่อมต่อเครื่องพิมพ์</button>
        </header>

        <main id="customer-menu" class="flex-1 overflow-y-auto p-5 pb-32 grid grid-cols-2 gap-4">
            </main>

        <div id="bottom-cart" class="fixed bottom-0 left-0 right-0 p-6 z-50 transform translate-y-full transition-transform duration-500">
            <button onclick="openOrderSummary()" class="w-full bg-slate-900 text-white p-5 rounded-[2.5rem] flex justify-between items-center shadow-2xl">
                <div class="flex items-center gap-4">
                    <div id="cart-count" class="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">0</div>
                    <span class="font-bold">ดูรายการ</span>
                </div>
                <span id="cart-total" class="font-black text-xl">฿0</span>
            </button>
        </div>

        <div id="order-overlay" class="fixed inset-0 bg-white z-[60] transform translate-y-full transition-transform duration-500 overflow-y-auto">
            <div class="p-8 max-w-xl mx-auto">
                <button onclick="closeOrderSummary()" class="mb-6 w-12 h-12 flex items-center justify-center bg-slate-50 rounded-full text-slate-400">✕</button>
                <div id="order-items" class="space-y-4 mb-10"></div>
                <div class="bg-slate-50 p-6 rounded-[2rem] mb-10 text-3xl font-black flex justify-between">
                    <span>สุทธิ</span>
                    <span id="summary-total" class="text-orange-600">฿0</span>
                </div>
                <button onclick="openPaymentModal()" class="w-full bg-orange-600 text-white py-6 rounded-[2.5rem] font-black text-2xl">ชำระเงิน</button>
            </div>
        </div>

        <div id="payment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-[3rem] shadow-2xl w-full max-w-sm p-8 text-center pop-in">
                <div class="bg-white p-4 rounded-[2rem] border-2 border-slate-100 mb-6">
                    <img id="qr-display-image" src="" class="mx-auto w-full max-w-[220px]">
                    <p id="payment-amount" class="text-4xl font-black text-slate-900 mt-4">฿0</p>
                </div>
                <button onclick="sendOrderAndPrint()" id="confirm-payment-btn" class="w-full py-5 bg-orange-600 text-white rounded-2xl font-bold text-xl active:scale-95 transition-all">
                    โอนเงินเรียบร้อยแล้ว
                </button>
                <button onclick="closePaymentModal()" class="mt-4 text-slate-400 font-bold">ย้อนกลับ</button>
            </div>
        </div>

        <div id="success-popup" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[110] hidden flex items-center justify-center p-6 text-center">
            <div class="bg-white rounded-[3.5rem] p-10 w-full max-w-sm">
                <h3 class="text-3xl font-black text-slate-800 mb-2">ขอบคุณค่ะ!</h3>
                <p class="text-slate-500 mb-6">รับใบเสร็จและรอเรียกคิว</p>
                <div class="bg-slate-50 rounded-[2.5rem] p-8">
                    <p class="text-xs font-bold mb-1">คิวที่</p>
                    <h2 id="popup-queue-no" class="text-6xl font-black">----</h2>
                </div>
            </div>
        </div>
    </div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbztypqVeKdZHc6MBDBjP-S8G3ZtObFgUcWkJxcgU-ElsQyupKSBu-yz9TZ3V93W5VFM/exec';
    const PROMPTPAY_ID = '0646793964';
    let products = [], cart = [], printCharacteristic = null;

    // 1. เชื่อมต่อเครื่องพิมพ์ (ต้องทำ 1 ครั้งเมื่อเปิดหน้าเว็บ)
    async function connectPrinter() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
            printCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
            
            document.getElementById('printer-status').innerText = "เครื่องพิมพ์เชื่อมต่อแล้ว";
            document.getElementById('printer-status').className = "bg-emerald-50 text-emerald-500 px-3 py-1 rounded-full text-[10px] font-bold";
        } catch (e) {
            alert("กรุณาเปิด Bluetooth และเลือกเครื่องพิมพ์");
        }
    }

    // 2. ฟังก์ชันพิมพ์ (ส่งคำสั่งตรงเข้าเครื่อง)
    async function directPrint(queueNo, total) {
        if (!printCharacteristic) return;

        const encoder = new TextEncoder();
        let commands = [
            "\x1B\x40",          // Reset
            "\x1B\x61\x01",      // Center
            "\x1B\x21\x30",      // Double size
            "CHICK CHICK\n",
            "\x1B\x21\x00",      // Normal size
            "--------------------------------\n",
            "\x1B\x61\x01",
            "QUEUE NO.\n",
            "\x1B\x21\x30",
            `${queueNo}\n`,
            "\x1B\x21\x00",
            "--------------------------------\n",
        ];

        cart.forEach(item => {
            commands.push(`${item.name} x${item.qty}\n`);
        });

        commands.push("--------------------------------\n");
        commands.push(`TOTAL: ${total} THB\n\n\n\n\n`);
        commands.push("\x1D\x56\x41\x03"); // Cut paper

        for (let cmd of commands) {
            await printCharacteristic.writeValue(encoder.encode(cmd));
        }
    }

    // 3. รวมทุกอย่างเมื่อกดชำระเงิน
    async function sendOrderAndPrint() {
        const btn = document.getElementById('confirm-payment-btn');
        btn.disabled = true;
        btn.innerText = "กำลังประมวลผล...";

        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        const queueNo = Math.floor(Math.random() * 900 + 1).toString().padStart(3, '0');

        // พิมพ์ทันที (ถ้าเชื่อมต่อ Bluetooth ไว้)
        if (printCharacteristic) {
            await directPrint(queueNo, total);
        } else {
            // ถ้าไม่ได้ต่อ Bluetooth ให้ใช้ window.print() เป็นแผนสำรอง
            window.print(); 
        }

        // แสดงผลหน้าจอ
        document.getElementById('payment-modal').classList.add('hidden');
        document.getElementById('popup-queue-no').innerText = queueNo;
        document.getElementById('success-popup').classList.remove('hidden');

        // บันทึกลง Sheets
        fetch(API_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ action: 'addSale', items: cart, total: total, orderType: 'AUTO-' + queueNo }) 
        });

        setTimeout(() => { location.reload(); }, 3000);
    }

    // --- ฟังก์ชันจัดการเมนูเดิม ---
    async function loadMenu() {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getProducts' }) });
        const result = await res.json();
        if (result.success) {
            products = result.data.filter(p => p.status === 'active');
            document.getElementById('customer-menu').innerHTML = products.map(p => `
                <div class="product-card bg-white rounded-[2rem] p-2 shadow-soft" onclick="addToCart('${p.id}')">
                    <img src="${p.image || ''}" class="w-full aspect-square object-cover rounded-[1.5rem] mb-2">
                    <div class="px-2 pb-2 text-center">
                        <p class="font-bold text-slate-800 text-sm truncate">${p.name}</p>
                        <p class="text-orange-600 font-black text-lg">฿${parseFloat(p.price).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }
    }

    function addToCart(id) {
        const p = products.find(i => i.id === id);
        const item = cart.find(i => i.productId === id);
        if (item) item.qty++; else cart.push({...p, productId: id, qty: 1});
        updateCartUI();
    }

    function updateCartUI() {
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        document.getElementById('bottom-cart').classList.toggle('translate-y-full', count === 0);
        document.getElementById('cart-count').textContent = count;
        document.getElementById('cart-total').textContent = `฿${total.toLocaleString()}`;
    }

    function openOrderSummary() {
        document.getElementById('order-items').innerHTML = cart.map(i => `
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl">
                <div class="flex-1 font-bold">${i.name}</div>
                <div class="flex items-center gap-3 bg-white px-3 py-1 rounded-lg">
                    <button onclick="changeQty('${i.productId}', -1)">-</button>
                    <span>${i.qty}</span>
                    <button onclick="changeQty('${i.productId}', 1)">+</button>
                </div>
            </div>
        `).join('');
        document.getElementById('summary-total').textContent = `฿${cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString()}`;
        document.getElementById('order-overlay').classList.remove('translate-y-full');
    }

    function changeQty(id, d) {
        const item = cart.find(i => i.productId === id);
        if (item) { item.qty += d; if (item.qty <= 0) cart = cart.filter(i => i.productId !== id); }
        updateCartUI();
        if (cart.length === 0) closeOrderSummary(); else openOrderSummary();
    }

    function openPaymentModal() {
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        document.getElementById('payment-amount').textContent = `฿${total.toLocaleString()}`;
        document.getElementById('qr-display-image').src = `https://promptpay.io/${PROMPTPAY_ID}/${total}.png`;
        document.getElementById('payment-modal').classList.remove('hidden');
    }

    function closePaymentModal() { document.getElementById('payment-modal').classList.add('hidden'); }
    function closeOrderSummary() { document.getElementById('order-overlay').classList.add('translate-y-full'); }

    window.onload = loadMenu;
</script>
</body>
</html>
